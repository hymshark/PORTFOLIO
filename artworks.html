n{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:14px;line-height:1.5}figcaption h2{margin:0;font-size:16px;font-weight:650;word-break:keep-all}figcaption p{margin:0;flex-shrink:0;font-size:12px;color:#888}.remaining{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 30px;margin-top:64px;align-items:start}.end{border-top:1px solid #d8d8d8;margin-top:64px;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#888}.end a{color:inherit;text-decoration:none;min-height:32px}.end a:hover{text-decoration:underline}dialog{padding:0;border:0;width:min(1200px,calc(100% - 40px));max-width:none;height:calc(100dvh - 40px);max-height:none;background:#f1f1ef;color:#333;overflow:hidden}dialog::backdrop{background:rgba(0,0,0,.8)}.viewer-bar{position:absolute;inset:0 0 auto;height:62px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;z-index:2}.viewer-title{margin:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}.viewer-controls button{display:grid;place-items:center;background:none;border:1px solid #ddd;width:36px;height:36px;font-size:21px;line-height:1}.viewer-count{font-size:12px;color:#777;margin-right:10px}.viewer-scroll{height:100%;overflow:auto;padding:88px 28px 28px;overscroll-behavior:contain}.viewer-image{display:block;max-width:100%;height:auto;margin:auto}.viewer-scroll.loading .viewer-image{opacity:.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:1000px){.lead>.artwork .image-button{background:#f5f5f3}.lead>.artwork .image-button>img{width:100%;max-height:790px;object-fit:contain}}@media(max-width:960px){main{width:calc(100% - 56px);padding-top:40px}.lead{gap:26px}.lead-secondary{gap:28px <dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-bar"><h2 id="viewer-title" class="viewer-title"></h2><div class="viewer-controls"><span class="viewer-count" id="viewer-count" aria-live="polite"></span><button type="button" id="previous" aria-label="이전 작업">←</button><button type="button" id="next" aria-label="다음 작업">→</button><button type="button" id="close" aria-label="확대 이미지 닫기" autofocus>×</button></div></div><div class="viewer-scroll" id="viewer-scroll"><img class="viewer-image" id="viewer-image" alt=""></div></dialog>
<script>
(()=>{'use strict';const buttons=[...document.querySelectorAll('.image-button')];const viewer=document.getElementById('viewer');const img=document.getElementById('viewer-image');const title=document.getElementById('viewer-title');const count=document.getElementById('viewer-count');const scroll=document.getElementById('viewer-scroll');let current=0;let trigger=null;
let scale=1,panX=0,panY=0,startScale=1,startDistance=0,lastX=0,lastY=0;const touches=new Map();
function drawZoom(){img.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')'}
function resetZoom(){scale=1;panX=panY=0;touches.clear();img.style.transform=''}
function pinchDistance(){const a=[...touches.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
scroll.addEventListener('pointerdown',e=>{if(!viewer.classList.contains('mobile-view'))return;scroll.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});lastX=e.clientX;lastY=e.clientY;if(touches.size===2){startDistance=pinchDistance();startScale=scale}});
scroll.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){scale=Math.min(5,Math.max(1,startScale*pinchDistance()/Math.max(1,startDistance)));if(scale===1)panX=panY=0}else if(touches.size===1&&scale>1){panX+=e.clientX-lastX;panY+=e.clientY-lastY;const b=img.getBoundingClientRect();const maxX=Math.max(0,(b.width-scroll.clientWidth)/2);const maxY=Math.max(0,(b.height-scroll.clientHeight)/2);panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY))}lastX=e.clientX;lastY=e.clientY;drawZoom()});
function releaseTouch(e){touches.delete(e.pointerId);if(touches.size===1){const a=[...touches.values()][0];lastX=a.x;lastY=a.y}}
scroll.addEventListener('pointerup',releaseTouch);scroll.addEventListener('pointercancel',releaseTouch);
scroll.addEventListener('dblclick',()=>{if(!viewer.classList.contains('mobile-view'))return;if(scale>1)resetZoom();else{scale=2;drawZoom()}});
function show(index){resetZoom();current=(index+buttons.length)%buttons.length;const button=buttons[current];const source=button.querySelector('img');img.src=source.getAttribute('src');img.alt=source.alt;title.textContent=button.closest('figure').querySelector('h2').textContent;count.textContent=(current+1)+' / '+buttons.length;scroll.scrollTop=0}buttons.forEach((button,index)=>button.addEventListener('click',event=>{event.preventDefault();viewer.classList.toggle('mobile-view',window.matchMedia('(max-width: 960px), (pointer: coarse)').matches);trigger=button;show(index);viewer.showModal();document.body.classList.add('modal-open')}));document.getElementById('previous').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));document.getElementById('close').addEventListener('click',()=>viewer.close());viewer.addEventListener('close',()=>{document.body.classList.remove('modal-open');resetZoom();img.removeAttribute('src');if(trigger)trigger.focus({preventScroll:true})});viewer.addEventListener('click',event=>{if(event.target===viewer){const r=viewer.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)viewer.close()}});viewer.addEventListener('keydown',event=>{if(event.key==='ArrowRight'){event.preventDefault();show(current+1)}else if(event.key==='ArrowLeft'){event.preventDefault();show(current-1)}})})();
</script>
