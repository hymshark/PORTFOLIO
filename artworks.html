<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="신혜미의 상품 이미지, 배너, 포스터 그래픽 작업 모음">
<title>Artworks — 신혜미</title>
<style>
@font-face{font-family:BigReputation;src:url('css/font/BigReputation/BigReputation-Sans.woff2') format('woff2');font-weight:normal;font-display:swap}
.portfolio-header{background:#fff;border-bottom:1px solid #aaa}.portfolio-header-inner{width:min(1320px,calc(100% - 96px));margin:auto;padding:12px 0}.portfolio-logo{display:inline-block;font-family:BigReputation,sans-serif;font-size:60px;line-height:1;color:#595959;text-decoration:none}.portfolio-logo:focus-visible{outline:3px solid #555;outline-offset:5px}@media(max-width:960px){.portfolio-header-inner{width:calc(100% - 56px)}}@media(max-width:600px){.portfolio-header-inner{width:calc(100% - 36px);padding:12px 0}.portfolio-logo{font-size:44px}}

@font-face{font-family:Pretendard;src:url('css/font/Pretendard/woff2/PretendardVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#333;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #555;outline-offset:5px}button{cursor:pointer}body.modal-open{overflow:hidden}main{width:min(1320px,calc(100% - 96px));margin:auto;padding:64px 0 56px}.intro{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:52px}.title{position:relative;isolation:isolate;font-size:clamp(32px,4vw,48px);font-weight:750;line-height:1.3;color:#fff;margin:0;padding:12px 30px}.title:before{content:"";position:absolute;inset:0;z-index:-1;background:#595959;clip-path:polygon(0 0,100% 0,98% 13%,100% 26%,98% 39%,100% 52%,98% 65%,100% 78%,98% 91%,100% 100%,0 100%,2% 87%,0 74%,2% 61%,0 48%,2% 35%,0 22%,2% 9%)}.collection-meta{text-align:right;font-size:13px;letter-spacing:.08em;line-height:1.8;color:#757575;margin:0}.collection-meta span{display:block;font-size:12px;letter-spacing:0;color:#888}.lead{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:start}.lead-secondary{display:grid;gap:40px}.artwork{margin:0;min-width:0}.image-button{display:block;position:relative;width:100%;padding:0;border:0;background:#f5f5f3;text-align:inherit;overflow:hidden}.image-button>img{display:block;width:100%;height:auto;transition:transform .3s}.image-button:hover>img{transform:scale(1.015)}.tool{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);padding:5px 8px;font-size:11px;letter-spacing:.02em;color:#333}.tool img{width:21px;height:21px}.expand{position:absolute;top:12px;right:12px;display:grid;place-items:center;width:32px;height:32px;background:rgba(255,255,255,.94);font-size:22px;color:#333;opacity:0;transition:opacity .2s}.image-button:hover .expand,.image-button:focus-visible .expand{opacity:1}figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:14px;line-height:1.5}figcaption h2{margin:0;font-size:16px;font-weight:650;word-break:keep-all}figcaption p{margin:0;flex-shrink:0;font-size:12px;color:#888}.remaining{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 30px;margin-top:64px;align-items:start}.end{border-top:1px solid #d8d8d8;margin-top:64px;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:#888}.end a{color:inherit;text-decoration:none;min-height:32px}.end a:hover{text-decoration:underline}dialog{padding:0;border:0;width:min(1200px,calc(100% - 40px));max-width:none;height:calc(100dvh - 40px);max-height:none;background:#f1f1ef;color:#333;overflow:hidden}dialog::backdrop{background:rgba(0,0,0,.8)}.viewer-bar{position:absolute;inset:0 0 auto;height:62px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;z-index:2}.viewer-title{margin:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}.viewer-controls button{display:grid;place-items:center;background:none;border:1px solid #ddd;width:36px;height:36px;font-size:21px;line-height:1}.viewer-count{font-size:12px;color:#777;margin-right:10px}.viewer-scroll{height:100%;overflow:auto;padding:88px 28px 28px;overscroll-behavior:contain}.viewer-image{display:block;max-width:100%;height:auto;margin:auto}.viewer-scroll.loading .viewer-image{opacity:.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:1000px){.lead>.artwork .image-button{background:#f5f5f3}.lead>.artwork .image-button>img{width:100%;max-height:790px;object-fit:contain}}@media(max-width:960px){main{width:calc(100% - 56px);padding-top:40px}.lead{gap:26px}.lead-secondary{gap:28px}.remaining{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 26px;margin-top:44px}.intro{margin-bottom:34px}figcaption{display:block}figcaption p{margin-top:4px}.end{margin-top:44px}}@media(max-width:600px){main{width:calc(100% - 36px);padding:28px 0}.intro{align-items:flex-start;gap:16px;margin-bottom:28px}.title{font-size:32px;padding:9px 21px}.collection-meta{font-size:10px;padding-top:8px}.collection-meta span{font-size:10px}.lead{grid-template-columns:1fr;gap:32px}.lead-secondary{gap:32px}.remaining{grid-template-columns:1fr;gap:32px;margin-top:32px}figcaption{display:flex}figcaption h2{font-size:15px}figcaption p{font-size:11px;margin:0}.expand{opacity:1;width:28px;height:28px;font-size:19px;top:9px;right:9px}.tool{bottom:9px;right:9px}.end{margin-top:36px;font-size:11px}dialog{width:100%;height:100dvh;margin:0}.viewer-bar{height:58px;padding:0 12px;gap:8px}.viewer-title{font-size:13px}.viewer-count{margin-right:3px;font-size:11px}.viewer-controls{gap:4px}.viewer-controls button{width:32px;height:34px}.viewer-scroll{padding:74px 12px 20px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.image-button>img,.expand{transition:none}.image-button:hover>img{transform:none}}
</style>
</head>
<body>
<header class="portfolio-header"><div class="portfolio-header-inner"><a class="portfolio-logo" href="#top" aria-label="HYEMI 아트워크 맨 위로">HYEMI</a></div></header>
<main id="top">
<div class="intro"><h1 class="title">Artworks</h1><p class="collection-meta">GRAPHIC DESIGN<span>신혜미 · 8 works</span></p></div>
<section class="lead" aria-label="상품 이미지와 배너 작업">
<figure class="artwork"><button type="button" class="image-button" data-index="0" aria-label="티트리 세럼 상품 이미지 확대"><img src="img/graphic/Ps_03.jpg" alt="녹색 배경에 티트리 세럼 제품과 상품 설명을 배치한 이미지" width="3164" height="4220" fetchpriority="high"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ps.svg" alt="">Photoshop</span></button><figcaption><h2>티트리 세럼</h2><p>상품 이미지</p></figcaption></figure>
<div class="lead-secondary">
<figure class="artwork"><button type="button" class="image-button" data-index="1" aria-label="고등학교 입학 설명회 배너 확대"><img src="img/graphic/Ps_01.jpg" alt="학교 사진 위에 입학 설명회 제목을 배치한 가로형 배너" width="1920" height="960"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ps.svg" alt="">Photoshop</span></button><figcaption><h2>고등학교 입학 설명회</h2><p>가로형 배너</p></figcaption></figure>
<figure class="artwork"><button type="button" class="image-button" data-index="2" aria-label="고등학교 입학 설명회 정사각형 이미지 확대"><img src="img/graphic/Ps_02.jpg" alt="밝은 연두색 배경에 학교와 책을 배치한 입학 설명회 이미지" width="960" height="960" loading="lazy"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ps.svg" alt="">Photoshop</span></button><figcaption><h2>고등학교 입학 설명회</h2><p>정사각형 이미지</p></figcaption></figure>
</div>
</section>
<section class="remaining" aria-label="포스터와 그래픽 작업">
<figure class="artwork"><button type="button" class="image-button" data-index="3" aria-label="프로포즈 공모전 포스터 확대"><img src="img/graphic/Ai_04.jpg" alt="검정 배경에 다채로운 하트와 타이포그래피를 배치한 공모전 포스터" width="1080" height="1350" loading="lazy"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ai.svg" alt="">Illustrator</span></button><figcaption><h2>프로포즈 공모전</h2><p>포스터</p></figcaption></figure>
<figure class="artwork"><button type="button" class="image-button" data-index="4" aria-label="Spring Event 그래픽 확대"><img src="img/graphic/Ai_03.jpg" alt="검정 배경에 입체 도넛 형태와 글자를 배치한 Spring Event 그래픽" width="1080" height="1080" loading="lazy"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ai.svg" alt="">Illustrator</span></button><figcaption><h2>Spring Event</h2><p>타이포그래피</p></figcaption></figure>
<figure class="artwork"><button type="button" class="image-button" data-index="5" aria-label="일찍 일어나는 새가 더 피곤하다 그래픽 확대"><img src="img/graphic/Ai_01.jpg" alt="부드러운 색상의 입체 형태와 한글 문구를 조합한 그래픽" width="1080" height="1080" loading="lazy"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ai.svg" alt="">Illustrator</span></button><figcaption><h2>일찍 일어나는 새가 더 피곤하다</h2><p>입체 그래픽</p></figcaption></figure>
<figure class="artwork"><button type="button" class="image-button" data-index="6" aria-label="Thank You 그래픽 확대"><img src="img/graphic/Ai_02.jpg" alt="푸른 배경에 분홍빛 하트와 흰색 손글씨를 조합한 그래픽" width="1080" height="1080" loading="lazy"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ai.svg" alt="">Illustrator</span></button><figcaption><h2>Thank You</h2><p>그래픽</p></figcaption></figure>
<figure class="artwork"><button type="button" class="image-button" data-index="7" aria-label="2025 시즌 인사 그래픽 확대"><img src="img/graphic/Ai_05.jpg" alt="보라색 배경에 파스텔 구체와 새해 인사 문구를 배치한 그래픽" width="1080" height="1080" loading="lazy"><span class="expand" aria-hidden="true">↗</span><span class="tool"><img src="img/Ai.svg" alt="">Illustrator</span></button><figcaption><h2>2025 Season’s Greetings</h2><p>그래픽</p></figcaption></figure>
</section>
<div class="end"><span>HYEMI · Artworks</span><a href="#top">맨 위로 ↑</a></div>
</main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-bar"><h2 id="viewer-title" class="viewer-title"></h2><div class="viewer-controls"><span class="viewer-count" id="viewer-count" aria-live="polite"></span><button type="button" id="previous" aria-label="이전 작업">←</button><button type="button" id="next" aria-label="다음 작업">→</button><button type="button" id="close" aria-label="확대 이미지 닫기" autofocus>×</button></div></div><div class="viewer-scroll" id="viewer-scroll"><img class="viewer-image" id="viewer-image" alt=""></div></dialog>
<script>
(()=>{'use strict';const buttons=[...document.querySelectorAll('.image-button')];const viewer=document.getElementById('viewer');const img=document.getElementById('viewer-image');const title=document.getElementById('viewer-title');const count=document.getElementById('viewer-count');const scroll=document.getElementById('viewer-scroll');let current=0;let trigger=null;function show(index){current=(index+buttons.length)%buttons.length;const button=buttons[current];const source=button.querySelector('img');img.src=source.getAttribute('src');img.alt=source.alt;title.textContent=button.closest('figure').querySelector('h2').textContent;count.textContent=(current+1)+' / '+buttons.length;scroll.scrollTop=0}buttons.forEach((button,index)=>button.addEventListener('click',()=>{trigger=button;show(index);viewer.showModal();document.body.classList.add('modal-open')}));document.getElementById('previous').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));document.getElementById('close').addEventListener('click',()=>viewer.close());viewer.addEventListener('close',()=>{document.body.classList.remove('modal-open');img.removeAttribute('src');if(trigger)trigger.focus({preventScroll:true})});viewer.addEventListener('click',event=>{if(event.target===viewer){const r=viewer.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)viewer.close()}});viewer.addEventListener('keydown',event=>{if(event.key==='ArrowRight'){event.preventDefault();show(current+1)}else if(event.key==='ArrowLeft'){event.preventDefault();show(current-1)}})})();
</script>
</body>
</html>
